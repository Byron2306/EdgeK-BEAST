matrix_id: beast.execution-targets.v1
schema_version: 1
targets:
  local:
    required_for_release: true
    owner: desktop.execution-target
    operations: [filesystem, search, git, terminal, tasks, tests, lsp, dap, extensions, agent]
    required_evidence: [structural, local_live]
  ssh:
    required_for_release: true
    owner: desktop.execution-target
    operations: [filesystem, search, git, terminal, tasks, tests, lsp, dap, extensions, agent]
    required_evidence: [structural, external_live, soak]
    invariants:
      - strict host-key verification
      - no silent local fallback
      - target identity on every receipt
  devcontainer:
    required_for_release: true
    owner: desktop.execution-target
    operations: [filesystem, search, git, terminal, tasks, tests, lsp, dap, extensions, agent]
    required_evidence: [structural, external_live, soak]
    invariants:
      - explicit container identity
      - no silent local fallback
      - target identity on every receipt
