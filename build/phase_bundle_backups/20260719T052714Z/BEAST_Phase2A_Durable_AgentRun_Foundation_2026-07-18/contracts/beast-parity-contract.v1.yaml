contract_id: beast.parity.v1
schema_version: 1
product: BEAST IDE
published_at: '2026-07-18'
definition: >-
  A capability is complete only when its user surface, bounded contract,
  automated acceptance, and required operational proof are all current for
  the release commit.
verification_classes:
  structural:
    description: Static wiring, schema, syntax, and ownership checks.
  local_live:
    description: Real execution against a disposable local runtime or repository.
  external_live:
    description: Real execution against configured SSH, container, provider, or network targets.
  soak:
    description: Long-duration, recovery, load, and interruption testing.
release_rules:
  required_tiers: [P1, P2, P3, P4, P5]
  no_silent_target_fallback: true
  no_unapproved_workspace_mutation: true
  evidence_required_for_mutation: true
  unsupported_surfaces_must_be_declared: true
tiers:
  P1:
    name: Daily-driver parity
    release_requirement: all_required
  P2:
    name: Protocol parity
    release_requirement: published_matrix
  P3:
    name: Operational parity
    release_requirement: required_environments
  P4:
    name: Extension compatibility
    release_requirement: published_subset
  P5:
    name: BEAST superiority
    release_requirement: mandatory
capabilities:
  - id: editor.workspace.open
    tier: P1
    owner: desktop.workspace
    targets: [local, ssh, devcontainer]
    status: operational
    verification: [structural, local_live]
