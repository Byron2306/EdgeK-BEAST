[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dai-diode-publication"
version = "0.1.1"
description = "Fail-closed publication, lineage, mutation, and ablation harness for DAI-Diode"
requires-python = ">=3.11"
dependencies = [
  "cryptography==44.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]

[project.scripts]
dai-publication = "dai_publication:main"

[tool.setuptools]
py-modules = ["dai_publication", "dai_publication_core"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
