[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dai-diode-publication"
version = "0.4.0"
description = "Fail-closed publication, lineage, mutation, ablation, lint, and independent-evidence harness for DAI-Diode"
requires-python = ">=3.11"
dependencies = [
  "cryptography==44.0.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
]

[project.scripts]
dai-publication = "dai_publication:main"
dai-evidence = "dai_evidence:main"
dai-attack = "dai_attack:main"
dai-ingest = "dai_ingest:main"
dai-lint = "dai_lint:main"

[tool.setuptools]
py-modules = [
  "dai_publication",
  "dai_publication_core",
  "dai_evidence",
  "dai_attack",
  "dai_ingest",
  "dai_lint",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
