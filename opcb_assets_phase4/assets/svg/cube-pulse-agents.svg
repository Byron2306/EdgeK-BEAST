<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="g" x1="35" y1="20" x2="205" y2="160">
      <stop stop-color="#39d7ff"/><stop offset=".45" stop-color="#39f0c2"/><stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .edge{fill:none;stroke:url(#g);stroke-width:3;filter:url(#glow);stroke-linejoin:round}
    .pulse{animation:pulse 1.95s ease-in-out infinite;transform-origin:120px 90px}
    .orb{animation:orbit 4s linear infinite;transform-origin:120px 91px}
    @keyframes pulse{50%{opacity:.62;transform:scale(.975)}}
    @keyframes orbit{to{transform:rotate(360deg)}}
  </style>
  <g class="pulse">
    <path class="edge" d="M120 24l58 34v66l-58 34-58-34V58z"/>
    <path class="edge" d="M62 58l58 34 58-34M120 92v66"/>
    <circle cx="120" cy="91" r="9" fill="#fff"/>
    <g class="orb">
      <circle cx="120" cy="56" r="7" fill="#39d7ff"/>
      <circle cx="150" cy="108" r="7" fill="#39f0c2"/>
      <circle cx="90" cy="108" r="7" fill="#ffc857"/>
    </g>
  </g>
</svg>
