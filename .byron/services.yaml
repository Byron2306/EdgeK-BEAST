version: 1
services:
  reverse_proxy:
    port: 80
  beast:
    hostname: beast.test
    upstream: 127.0.0.1:8102
    port: 8102
    health_path: /health
    trust_domain: operator
  commons:
    hostname: commons.test
    upstream: 127.0.0.1:8601
    port: 8601
    health_path: /edgek/control-plane/commons
    trust_domain: commons
  arda:
    hostname: arda.test
    upstream: 127.0.0.1:18401
    port: 18401
    health_path: /docs
    trust_domain: witness
  seraph_ui:
    hostname: seraph.test
    upstream: 127.0.0.1:3000
    port: 3000
    health_path: /
    trust_domain: operator
  seraph_api:
    hostname: api.seraph.test
    upstream: 127.0.0.1:8001
    port: 8001
    health_path: /api/health
    trust_domain: production
