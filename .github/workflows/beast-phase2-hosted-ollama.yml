name: BEAST Phase 2 Hosted Ollama Acceptance

on:
  push:
    branches:
      - agent/beast-coding-agent-phase2-runtime-trace
  pull_request:
    paths:
      - '.github/workflows/beast-phase2-hosted-ollama.yml'
      - 'app/kernel/agents/ollama_planner_provider.py'
      - 'tests/phase2/test_live_ollama_provider_acceptance.py'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BEAST_LIVE_OLLAMA_ACCEPTANCE: '1'
      BEAST_LIVE_OLLAMA_MODEL: qwen2.5:0.5b
      BEAST_OLLAMA_NUM_CTX: '2048'
      BEAST_OLLAMA_NUM_PREDICT: '128'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull bounded model
        run: |
          ollama serve >/tmp/beast-ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          ollama pull "$BEAST_LIVE_OLLAMA_MODEL"
      - name: Verify real native planner exchange
        run: python -m pytest -q --noconftest tests/phase2/test_live_ollama_provider_acceptance.py --junitxml=/tmp/beast-phase2-ollama.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beast-phase2-ollama-results
          path: /tmp/beast-phase2-ollama.xml
