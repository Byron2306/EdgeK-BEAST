name: BEAST Recovery Phase 4 Repository Intelligence

on:
  push:
    branches:
      - agent/beast-coding-agent-phase4-perception-intelligence
  pull_request:
    paths:
      - 'app/kernel/agents/repository_intelligence.py'
      - 'app/kernel/agents/planner_runtime.py'
      - 'app/kernel/agents/run_engine.py'
      - 'app/kernel/data_processing/context_packet.py'
      - 'app/kernel/data_processing/code_cortex.py'
      - 'tests/recovery_phase4/**'
      - 'tests/test_context_packet.py'
      - 'tests/test_agent_planner_runtime.py'
      - '.github/workflows/beast-recovery-phase4-perception.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BEAST dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "cryptography>=43,<48" "numpy>=2,<3"

      - name: Prove Code Cortex and Context Packet contracts
        run: |
          python -m pytest -q --noconftest             tests/test_context_packet.py             tests/recovery_phase4/test_repository_intelligence.py

      - name: Preserve Recovery Phase 3 planner core
        run: |
          python -m pytest -q --noconftest             tests/recovery_phase3/test_core_repair_contracts.py             tests/test_agent_planner_runtime.py             -k "core_repair_contracts or budget_edge_autofinalizes or large_real_repo_endurance or planner_turn_budget"

      - name: Preserve Recovery Phase 2 evidence boundaries
        run: |
          python -m pytest -q --noconftest             tests/test_beast_coding_agent_phase2_trace.py             tests/phase2/test_multifile_phase_guard.py             tests/phase2/test_sensorium_agent_run_receipt.py
