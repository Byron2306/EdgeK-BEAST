name: DAI-Diode publication closure

on:
  pull_request:
    paths:
      - "research/dai-diode-publication/**"
      - ".github/workflows/dai-diode-publication.yml"
  push:
    branches:
      - "agent/dai-diode-final-publication-closure"
    paths:
      - "research/dai-diode-publication/**"
      - ".github/workflows/dai-diode-publication.yml"

permissions:
  contents: read

jobs:
  verify-harness:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: research/dai-diode-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/dai-diode-publication/pyproject.toml
      - name: Install exact test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Compile
        run: make lint
      - name: Unit and hostile-path tests
        run: make test
      - name: Synthetic build/verify/mutation self-test
        run: make selftest
