name: DIO Remote GitHub Witness

on:
  workflow_dispatch:
    inputs:
      proposal_json_b64:
        description: "Optional base64-encoded DIOProposalPacket JSON for shared Commons quorum"
        required: false
        type: string
  push:
    branches:
      - chore/wip-safety-hygiene
    paths:
      - "app/kernel/dai/**"
      - "app/dio_hf_witness_main.py"
      - "scripts/run_dio_github_actions_witness.py"
      - "scripts/harvest_dio_gcp_tee_attestation.py"
      - "tests/test_dio_*.py"
      - ".github/workflows/dio-remote-witness.yml"
  pull_request:
    paths:
      - "app/kernel/dai/**"
      - "app/dio_hf_witness_main.py"
      - "scripts/run_dio_github_actions_witness.py"
      - "scripts/harvest_dio_gcp_tee_attestation.py"
      - "tests/test_dio_*.py"
      - ".github/workflows/dio-remote-witness.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  dio-github-actions-witness:
    name: Remote OIDC/Sigstore software witness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused DIO witness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography>=43,<46" \
            "fastapi>=0.115,<1.0" \
            "httpx>=0.28,<1.0" \
            "pydantic>=2.10,<3.0" \
            "PyYAML==6.0.2" \
            "pytest>=9.0,<10.0" \
            "pytest-asyncio>=1.3,<2.0"

      - name: Run DIO remote witness contract tests
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          python -m pytest \
            --noconftest \
            tests/test_dio_cloud_attestation.py \
            tests/test_dio_remote_witness_packet.py \
            tests/test_dio_github_actions_witness.py \
            -q

      - name: Emit Phase-5 DIO GitHub autonomous witness packet
        env:
          DIO_GITHUB_TEST_STATUS: passed
          DIO_GITHUB_TEST_COMMAND: "python -m pytest --noconftest tests/test_dio_cloud_attestation.py tests/test_dio_remote_witness_packet.py tests/test_dio_github_actions_witness.py -q"
          DIO_SHARED_PROPOSAL_B64: ${{ inputs.proposal_json_b64 || '' }}
        run: |
          PROPOSAL_ARGS=()
          if [ -n "$DIO_SHARED_PROPOSAL_B64" ]; then
            python -c 'import base64, os, pathlib; pathlib.Path("/tmp/dio-shared-proposal.json").write_bytes(base64.b64decode(os.environ["DIO_SHARED_PROPOSAL_B64"], validate=True))'
            PROPOSAL_ARGS=(--proposal-file /tmp/dio-shared-proposal.json)
          fi
          python scripts/run_dio_github_actions_witness.py \
            "${PROPOSAL_ARGS[@]}" \
            --out evidence/dai-diode/phase5-github-witness/dio_github_actions_autonomous_witness_packet.json

      - name: Upload Phase-5 DIO GitHub autonomous witness packet
        uses: actions/upload-artifact@v4
        with:
          name: dio-github-actions-autonomous-witness-packet
          path: evidence/dai-diode/phase5-github-witness/dio_github_actions_autonomous_witness_packet.json
          if-no-files-found: error

      - name: Attest Phase-5 DIO GitHub autonomous witness packet
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: evidence/dai-diode/phase5-github-witness/dio_github_actions_autonomous_witness_packet.json
