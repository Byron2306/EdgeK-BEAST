name: DIO Remote GitHub Witness

on:
  workflow_dispatch:
  push:
    branches:
      - chore/wip-safety-hygiene
    paths:
      - "app/kernel/dai/**"
      - "app/dio_hf_witness_main.py"
      - "scripts/run_dio_github_actions_witness.py"
      - "scripts/harvest_dio_gcp_tee_attestation.py"
      - "tests/test_dio_*.py"
      - ".github/workflows/dio-remote-witness.yml"
  pull_request:
    paths:
      - "app/kernel/dai/**"
      - "app/dio_hf_witness_main.py"
      - "scripts/run_dio_github_actions_witness.py"
      - "scripts/harvest_dio_gcp_tee_attestation.py"
      - "tests/test_dio_*.py"
      - ".github/workflows/dio-remote-witness.yml"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  dio-github-actions-witness:
    name: Remote OIDC/Sigstore software witness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install focused DIO witness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography>=43,<46" \
            "fastapi>=0.115,<1.0" \
            "httpx>=0.28,<1.0" \
            "pydantic>=2.10,<3.0" \
            "pytest>=9.0,<10.0" \
            "pytest-asyncio>=1.3,<2.0"

      - name: Run DIO remote witness contract tests
        env:
          PYTHONNOUSERSITE: "1"
        run: |
          python -m pytest \
            tests/test_dio_distributed_quorum.py \
            tests/test_dio_cloud_attestation.py \
            -q

      - name: Emit DIO GitHub witness packet
        env:
          DIO_GITHUB_TEST_STATUS: passed
          DIO_GITHUB_TEST_COMMAND: "python -m pytest tests/test_dio_distributed_quorum.py tests/test_dio_cloud_attestation.py -q"
        run: |
          python scripts/run_dio_github_actions_witness.py \
            --out evidence/dai-diode/phase2.1-github-witness/dio_github_actions_witness_packet.json

      - name: Upload DIO GitHub witness packet
        uses: actions/upload-artifact@v4
        with:
          name: dio-github-actions-witness-packet
          path: evidence/dai-diode/phase2.1-github-witness/dio_github_actions_witness_packet.json
          if-no-files-found: error

      - name: Attest DIO GitHub witness packet
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: evidence/dai-diode/phase2.1-github-witness/dio_github_actions_witness_packet.json
