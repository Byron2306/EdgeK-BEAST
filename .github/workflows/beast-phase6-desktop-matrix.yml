name: BEAST Phase 6 Desktop Matrix
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-ide/**'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-ide
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-ide/package-lock.json
      - run: npm ci
      - name: Static and renderer gate
        shell: bash
        run: node scripts/beast-phase6-platform-gate.js --desktop . --target local --json phase6_7_${{ runner.os }}_local.json
      - name: Native package directory
        shell: bash
        run: node scripts/beast-phase6-platform-gate.js --desktop . --target local --package --json phase6_7_${{ runner.os }}_package.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-7-${{ runner.os }}
          path: desktop-ide/phase6_7_*.json
