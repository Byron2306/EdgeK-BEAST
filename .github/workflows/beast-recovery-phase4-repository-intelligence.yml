name: BEAST Recovery Phase 4 Repository Intelligence

on:
  push:
    branches:
      - agent/beast-coding-agent-phase4-perception-repository-intelligence
  pull_request:
    paths:
      - 'app/kernel/agents/repository_perception.py'
      - 'app/kernel/agents/tool_runtime.py'
      - 'app/kernel/agents/planner_runtime.py'
      - 'app/kernel/data_processing/code_cortex.py'
      - 'app/kernel/sensorium/workspace_invalidation.py'
      - 'tests/recovery_phase4/**'
      - 'tests/test_agent_planner_runtime.py'
      - '.github/workflows/beast-recovery-phase4-repository-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BEAST dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install cryptography
      - name: Prove cross-file repository discovery without attachments
        run: |
          python -m pytest -q --noconftest             tests/recovery_phase4/test_repository_perception.py             --junitxml=/tmp/recovery-phase4.xml
      - name: Preserve repaired Agent Core
        run: |
          python -m pytest -q --noconftest             tests/test_agent_planner_runtime.py             -k 'large_real_repo_endurance or planner_executes_tools_and_completes or budget_edge_autofinalizes_after_verify_and_sourceplan or planner_prompt_includes_ide_semantic_context'             --junitxml=/tmp/recovery-phase4-phase3-regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beast-recovery-phase4-repository-intelligence
          path: |
            /tmp/recovery-phase4.xml
            /tmp/recovery-phase4-phase3-regression.xml
