[pytest]
testpaths = tests
markers =
    unit: deterministic local unit tests
    api: FastAPI ASGI/TestClient API tests
    cli: CLI subprocess tests
    mcp: MCP protocol and broker tests
    live: requires a running gateway or external service
    benchmark: slower benchmark or gauntlet tests
    semantic: requires semantic/vector optional dependencies
    integration: requires optional integrations or cross-module services
    manual: manual/demo protocol experiments
addopts = -q
