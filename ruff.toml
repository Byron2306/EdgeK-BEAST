# BEAST ruff lint configuration
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "N806", "N803", "SIM108", "UP007"]

[lint.per-file-ignores]
"tests/**" = ["B", "N"]
"benchmarks/**" = ["B", "N"]

[format]
quote-style = "double"
indent-style = "space"
