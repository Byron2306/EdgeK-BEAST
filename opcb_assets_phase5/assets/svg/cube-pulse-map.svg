<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="g" x1="35" y1="20" x2="205" y2="160">
      <stop stop-color="#39f0c2"/><stop offset=".45" stop-color="#39d7ff"/><stop offset="1" stop-color="#b36bff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .edge{fill:none;stroke:url(#g);stroke-width:3;filter:url(#glow);stroke-linejoin:round}
    .flow{stroke-dasharray:5 7;animation:flow 1.6s linear infinite}
    .pulse{animation:pulse 1.95s ease-in-out infinite;transform-origin:120px 90px}
    @keyframes pulse{50%{opacity:.64;transform:scale(.975)}}
    @keyframes flow{to{stroke-dashoffset:-24}}
  </style>
  <g class="pulse">
    <path class="edge" d="M120 24l58 34v66l-58 34-58-34V58z"/>
    <path class="edge" d="M62 58l58 34 58-34M120 92v66"/>
    <path class="edge flow" d="M82 80h76M97 111h46"/>
    <circle cx="82" cy="80" r="6" fill="#39f0c2"/>
    <circle cx="158" cy="80" r="6" fill="#b36bff"/>
    <circle cx="120" cy="111" r="8" fill="#fff"/>
  </g>
</svg>
