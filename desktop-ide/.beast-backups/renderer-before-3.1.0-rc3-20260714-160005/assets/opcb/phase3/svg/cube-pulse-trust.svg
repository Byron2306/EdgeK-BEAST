<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="g" x1="35" y1="20" x2="205" y2="160">
      <stop stop-color="#39f0c2"/><stop offset=".5" stop-color="#39d7ff"/><stop offset="1" stop-color="#ffc857"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .edge{fill:none;stroke:url(#g);stroke-width:3;filter:url(#glow);stroke-linejoin:round}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:120px 90px}
    .scan{stroke-dasharray:6 7;animation:flow 1.8s linear infinite}
    @keyframes pulse{50%{opacity:.68;transform:scale(.975)}}
    @keyframes flow{to{stroke-dashoffset:-26}}
  </style>
  <g class="pulse">
    <path class="edge" d="M120 24l58 34v66l-58 34-58-34V58z"/>
    <path class="edge" d="M62 58l58 34 58-34M120 92v66"/>
    <path d="M120 54l31 13v22c0 22-14 37-31 44-17-7-31-22-31-44V67l31-13z" fill="#39f0c2" opacity=".18" stroke="#39f0c2" stroke-width="2"/>
    <path class="edge scan" d="M101 91l12 12 27-34"/>
  </g>
</svg>
