<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
  <defs>
    <linearGradient id="g" x1="35" y1="20" x2="205" y2="160">
      <stop stop-color="#39f0c2"/><stop offset=".45" stop-color="#39d7ff"/><stop offset="1" stop-color="#b36bff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .edge{fill:none;stroke:url(#g);stroke-width:3;filter:url(#glow);stroke-linejoin:round}
    .pulse{animation:pulse 1.85s ease-in-out infinite;transform-origin:120px 90px}
    .bars rect{animation:rise 1.7s ease-in-out infinite}
    .bars rect:nth-child(2){animation-delay:.2s}.bars rect:nth-child(3){animation-delay:.4s}
    @keyframes pulse{50%{opacity:.64;transform:scale(.975)}}
    @keyframes rise{50%{transform:translateY(-8px);opacity:.55}}
  </style>
  <g class="pulse">
    <path class="edge" d="M120 24l58 34v66l-58 34-58-34V58z"/>
    <path class="edge" d="M62 58l58 34 58-34M120 92v66"/>
    <g class="bars">
      <rect x="92" y="92" width="10" height="26" rx="3" fill="#39f0c2"/>
      <rect x="115" y="78" width="10" height="40" rx="3" fill="#39d7ff"/>
      <rect x="138" y="64" width="10" height="54" rx="3" fill="#b36bff"/>
    </g>
  </g>
</svg>
